name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    name: Test, Typecheck, Security & Release Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version consistency check
        run: bun run check:version

      - name: Typecheck
        run: bun run typecheck

      - name: Run full test suite
        run: bun test

      - name: Path security and provider contract gates
        run: bun test tests/tools.test.ts tests/provider-contracts.test.ts tests/commandcode.test.ts

      - name: Build distribution bundle
        run: bun run build

      - name: Compile standalone executable
        run: bun run compile

      - name: Validate compiled standalone executable
        run: |
          ./dist/mimin --help
          ./dist/mimin --version
