name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Quality gate: the tag must pass the same checks as CI before anything ships.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Cross-compile standalone binaries for every major platform/arch pair.
      - name: Compile binaries
        run: |
          mkdir -p dist
          targets=(
            "bun-linux-x64 mimin-linux-x64"
            "bun-linux-arm64 mimin-linux-arm64"
            "bun-darwin-x64 mimin-darwin-x64"
            "bun-darwin-arm64 mimin-darwin-arm64"
            "bun-windows-x64 mimin-windows-x64.exe"
          )
          for pair in "${targets[@]}"; do
            set -- $pair
            bun build --compile src/index.ts --target="$1" --outfile="dist/$2"
          done

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 ${GITHUB_REF_NAME}^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            CHANGELOG=$(git log --oneline --no-decorate "$PREV..$GITHUB_REF_NAME")
          else
            CHANGELOG=$(git log --oneline --no-decorate)
          fi
          {
            echo "## What's changed"
            echo ""
            echo "$CHANGELOG"
          } > CHANGELOG.md
          echo "changelog_file=CHANGELOG.md" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mimin-linux-x64
            dist/mimin-linux-arm64
            dist/mimin-darwin-x64
            dist/mimin-darwin-arm64
            dist/mimin-windows-x64.exe
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          fail_on_unmatched_files: true
